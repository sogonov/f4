# A probe for #2185, never meant for main: the audio engine around a suspend
# and a resume of the output, on runners with a sound device (and on Linux a
# PulseAudio server with its null sink).
name: audio-probe

on:
  push:
    branches: ['probe/**']

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: false
      - name: PulseAudio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Probe
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: go test -count=1 -v -timeout 5m -run 'TestAudioProbe|TestAudioEngineGoesOnPlaying' ./internal/media/
